name: Update Timeline

on:
  schedule:
    - cron: '0 * * * *'

  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download CSV
        run: |
          curl -L \
          "https://sheet.zohopublic.in/sheet/published/ghmsj5a0f4a8bef8c470d801bdea3431d6ffb?download=csv" \
          -o timeline.csv

      - name: Convert CSV to JSON
        run: |
          python .github/scripts/csv_to_json.py

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add data/timeline.json

          git diff --staged --quiet || \
          git commit -m "Update timeline"

          git push